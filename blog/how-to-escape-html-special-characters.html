<h1>How to Display Special Characters Safely in HTML</h1>
<p class="article-lead">Try to display the literal text "<script>" or "Tom & Jerry" directly inside an HTML page, and the browser either breaks or interprets it as markup instead of text. HTML entities are the fix.</p>
<div class="article-ad-slot" aria-hidden="true"></div>
<h2>Why these characters cause problems</h2>
<p>A handful of characters have special meaning in HTML: <code>&lt;</code> and <code>&gt;</code> open and close tags, <code>&amp;</code> starts a character reference, and quote marks delimit attribute values. If your actual content needs to display one of these literally — showing example code, a company name with an ampersand, or user-submitted text — the browser needs to be told "treat this as text, not markup."</p>
<h2>How to encode text</h2>
<ol>
<li>Open the <a href="../tools/html-entity-encoder-decoder/">HTML Entity Encoder & Decoder</a>.</li>
<li>Paste your text into the input box.</li>
<li>Click Encode to Entities. <code>&lt;</code>, <code>&gt;</code>, <code>&amp;</code> and quote marks are converted to their safe entity equivalents.</li>
<li>Paste the result directly into your HTML.</li>
</ol>
<h2>Decoding entities back to text</h2>
<p>The reverse direction is just as common — a scraped page, an RSS feed or a CMS export often contains entities like <code>&amp;amp;</code> or <code>&amp;#039;</code> where you'd want the actual character. Click Decode Entities to turn those back into readable text, including numeric references like <code>&amp;#169;</code> and named ones like <code>&amp;copy;</code>.</p>
<h2>Where this connects to security</h2>
<p>Correctly encoding untrusted content before inserting it into a page is one important layer of defense against cross-site scripting (XSS) — it stops text a user typed from being interpreted as executable markup. It's one piece of a broader security practice, not a complete solution by itself, but it's a foundational one.</p>
<h2>A related but different kind of encoding</h2>
<p>HTML entities and URL percent-encoding solve similar-sounding but different problems — see the <a href="url-encoding-explained.html">URL encoding guide</a> if what you actually need is to safely embed a value inside a link rather than inside page content.</p>
<h2>FAQ: Escaping HTML Special Characters</h2>
<h3>Does encoding protect against every kind of XSS attack?</h3>
<p>It's one important defense, but not a complete solution on its own — proper context-aware output encoding and other security practices are still needed in real applications.</p>
<h3>What&#x27;s the difference between named and numeric entities?</h3>
<p>Named entities like <code>&amp;amp;</code> are easier to read; numeric entities like <code>&amp;#38;</code> represent the same character by Unicode code point and work even without a common named entity.</p>
<h3>Will encoding change how my text displays to users?</h3>
<p>No — a correctly encoded character displays exactly as the original character once the browser renders the HTML; encoding only affects how it's represented in the underlying markup.</p>
