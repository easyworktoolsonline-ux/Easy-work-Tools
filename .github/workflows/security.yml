name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to actions/checkout v4.2.2 (full commit SHA) for SHA-pin policy.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Runtime versions
        run: node --version && npm --version

      - name: Install dependencies from the committed lockfile
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Security regression tests
        run: npm run test:security

      # The local lint script targets an intentionally untracked developer file,
      # so CI validates the syntax of every tracked JavaScript file instead.
      - name: Tracked JavaScript syntax check
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' '*.mjs')

      - name: Dependency audit
        run: npm audit --json

      - name: Production dependency audit
        run: npm audit --omit=dev --json

      - name: Committed diff whitespace check
        run: git diff --check HEAD^ HEAD
